version: '3.9'

services:
  downloader:
    build: .
    ports:
      - '3131:3000' # external:internal, since CONFIG.PORT defaults to 3000
    environment:
      DATA_DIR: '/app/data' # app’s internal writable data dir
      API_TOKENS_PATH: '/config/apiKeys.json' # external user-provided config
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
    volumes:
      - ./data:/app/data # writable local folder for app data
      - ./config/apiKeys.json:/config/apiKeys.json:ro # user-provided token file (read-only)
